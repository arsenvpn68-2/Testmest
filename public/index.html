<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت چندپروفایله Xray</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #0284c7; --text: #f8fafc; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 850px; margin: auto; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        h1, h3 { color: #38bdf8; margin-top: 0; }
        label { display: block; margin-top: 12px; margin-bottom: 6px; color: #94a3b8; font-size: 0.9em; }
        input, textarea, select { width: 100%; background: #0f172a; border: 1px solid #334155; color: #38bdf8; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        textarea { height: 110px; resize: vertical; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; margin-left: 10px; }
        .btn:hover { opacity: 0.9; }
        .btn-run { background: #16a34a; }
        .btn-danger { background: #dc2626; }
        .sub-box { background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 6px; word-break: break-all; color: #4ade80; font-family: monospace; }
        .status { margin-top: 15px; font-weight: bold; color: #eab308; }
        .profile-bar { display: flex; gap: 10px; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ پنل مدیریت هوشمند و چندپروفایله Xray</h1>

        <div class="card">
            <h3>👤 مدیریت پروفایل‌ها (کاربران)</h3>
            <div class="profile-bar">
                <div style="flex: 2;">
                    <label style="margin: 0 0 4px 0;">انتخاب پروفایل فعلی:</label>
                    <select id="profile-select" onchange="switchProfile()">
                        <option value="default">پیش‌فرض (Default)</option>
                    </select>
                </div>
                <div style="flex: 2;">
                    <label style="margin: 0 0 4px 0;">ایجاد پروفایل جدید (نام لاتین):</label>
                    <input type="text" id="new-profile-name" placeholder="مثلا: user2 یا reza">
                </div>
                <div style="flex: 1; margin-top: 18px;">
                    <button class="btn" style="margin:0; width:100%;" onclick="createNewProfile()">➕ ساخت</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>🔗 لینک‌های اختصاصی پروفایل انتخاب‌شده</h3>
            <label>فرمت V2Ray / v2rayNG / Hiddify:</label>
            <div class="sub-box" id="url-v2ray">...</div>
            <label>فرمت Clash Meta / FlClash (YAML):</label>
            <div class="sub-box" id="url-clash">...</div>
            <label>فرمت Sing-box (JSON):</label>
            <div class="sub-box" id="url-singbox">...</div>
        </div>

        <div class="card">
            <h3>🔑 اطلاعات اتصال به GitHub API</h3>
            <label>توکن شخصی گیت‌هاب (Personal Access Token):</label>
            <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
            <label>نام کاربری گیت‌هاب (Username):</label>
            <input type="text" id="gh-owner" placeholder="مثال: myaccount">
            <label>نام ریپازیتوری (Repository):</label>
            <input type="text" id="gh-repo" placeholder="مثال: Testmest">
            <button class="btn" onclick="saveCredentials()">ذخیره کلیدها در مرورگر</button>
        </div>

        <div class="card">
            <h3>⚙️ تنظیمات پروفایل <span id="current-profile-title" style="color:#38bdf8;">default</span></h3>
            
            <label>🏷️ نام دلخواه برندینگ برای این کاربر:</label>
            <input type="text" id="brand-name" placeholder="مثال: 𝔸𝕣𝕤𝕖𝕟VPℕ𓄂𓆃 ❻❽">

            <label>🔒 سرورهای شخصی این کاربر (دست‌نخورده):</label>
            <textarea id="personal-nodes" placeholder="vless://...\nvmess://..."></textarea>

            <label>🌐 لینک‌های سابسکریپشن عمومی این کاربر:</label>
            <textarea id="sub-urls" placeholder="https://site.com/sub1\nhttps://site.com/sub2"></textarea>

            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>🔢 تعداد سرورهای عمومی برتر:</label>
                    <input type="number" id="top-count" value="20" min="5" max="100">
                </div>
            </div>

            <button class="btn" onclick="updateConfigOnGithub()">💾 ذخیره این پروفایل روی گیت‌هاب</button>
            <button class="btn btn-run" onclick="triggerWorkflow()">🚀 اجرای فوری تست سرعت</button>

            <div class="status" id="status-msg"></div>
        </div>
    </div>

    <script>
        let fullConfig = { profiles: { default: { brand_name: "𝔸𝕣𝕤𝕖𝕟VPℕ𓄂𓆃 ❻❽", personal: [], subs: [], top_count: 20 } } };
        let activeProfile = "default";

        document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
        document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || '';
        document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';

        function saveCredentials() {
            localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
            localStorage.setItem('gh_owner', document.getElementById('gh-owner').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
            alert('اطلاعات دسترسی ذخیره شد.');
        }

        function updateUrls() {
            const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '').replace(/\/$/, '') + '/';
            const suffix = activeProfile === "default" ? "" : "_" + activeProfile;
            document.getElementById('url-v2ray').innerText = baseUrl + 'sub' + suffix + '.txt';
            document.getElementById('url-clash').innerText = baseUrl + 'clash' + suffix + '.yaml';
            document.getElementById('url-singbox').innerText = baseUrl + 'singbox' + suffix + '.json';
            document.getElementById('current-profile-title').innerText = activeProfile;
        }

        function renderProfileSelect() {
            const select = document.getElementById('profile-select');
            select.innerHTML = '';
            Object.keys(fullConfig.profiles).forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.innerText = p === 'default' ? 'پیش‌فرض (default)' : p;
                if (p === activeProfile) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function loadActiveProfileData() {
            const pData = fullConfig.profiles[activeProfile] || { brand_name: '', personal: [], subs: [], top_count: 20 };
            document.getElementById('brand-name').value = pData.brand_name || '';
            document.getElementById('personal-nodes').value = (pData.personal || []).join('\n');
            document.getElementById('sub-urls').value = (pData.subs || []).join('\n');
            document.getElementById('top-count').value = pData.top_count || 20;
            updateUrls();
        }

        function switchProfile() {
            activeProfile = document.getElementById('profile-select').value;
            loadActiveProfileData();
        }

        function createNewProfile() {
            const nameInput = document.getElementById('new-profile-name');
            const name = nameInput.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!name) return alert('لطفا یک نام لاتین ساده وارد کنید (مانند user2)');
            if (fullConfig.profiles[name]) return alert('این پروفایل از قبل وجود دارد.');

            fullConfig.profiles[name] = {
                brand_name: "𝔸𝕣𝕤𝕖𝕟VPℕ𓄂𓆃 - " + name,
                personal: [],
                subs: [],
                top_count: 20
            };
            activeProfile = name;
            nameInput.value = '';
            renderProfileSelect();
            loadActiveProfileData();
        }

        fetch('config.json?t=' + Date.now())
            .then(r => r.json())
            .then(data => {
                if (data.profiles) fullConfig = data;
                else {
                    fullConfig = {
                        profiles: {
                            default: {
                                brand_name: data.brand_name || "𝔸𝕣𝕤𝕖𝕟VPℕ𓄂𓆃 ❻❽",
                                personal: data.personal || [],
                                subs: data.subs || [],
                                top_count: data.top_count || 20
                            }
                        }
                    };
                }
                renderProfileSelect();
                loadActiveProfileData();
            }).catch(() => {
                renderProfileSelect();
                loadActiveProfileData();
            });

        async function updateConfigOnGithub() {
            const token = localStorage.getItem('gh_token');
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const status = document.getElementById('status-msg');

            if (!token || !owner || !repo) return alert('لطفا ابتدا مشخصات گیت‌هاب را تکمیل کنید.');

            status.innerText = "در حال ذخیره‌سازی تنظیمات در گیت‌هاب...";

            // ذخیره اطلاعات فرم فعلی روی پروفایل اکتیو
            fullConfig.profiles[activeProfile] = {
                brand_name: document.getElementById('brand-name').value.trim() || '𝔸𝕣𝕤𝕖𝕟VPℕ𓄂𓆃 ❻❽',
                personal: document.getElementById('personal-nodes').value.split('\n').map(s=>s.trim()).filter(Boolean),
                subs: document.getElementById('sub-urls').value.split('\n').map(s=>s.trim()).filter(Boolean),
                top_count: parseInt(document.getElementById('top-count').value) || 20
            };

            let sha = "";
            try {
                const getFile = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/public/config.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (getFile.ok) {
                    const fileData = await getFile.json();
                    sha = fileData.sha;
                }
            } catch(e) {}

            const jsonString = JSON.stringify(fullConfig, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/public/config.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Update profiles config via Web Panel (${activeProfile})`, content: encodedContent, sha: sha })
                });

                if (res.ok) status.innerText = `✅ پروفایل ${activeProfile} با موفقیت ذخیره شد!`;
                else status.innerText = "❌ خطا در ذخیره تنظیمات.";
            } catch (e) {
                status.innerText = "❌ خطا: " + e.message;
            }
        }

        async function triggerWorkflow() {
            const token = localStorage.getItem('gh_token');
            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const status = document.getElementById('status-msg');

            if (!token || !owner || !repo) return alert('مشخصات اتصال کامل نیست.');

            status.innerText = "در حال ارسال دستور تست سرعت به اکشن...";
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/main.yml/dispatches`, {
                    method: 'POST',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ref: 'main' })
                });
                if (res.status === 204) status.innerText = "🚀 تست سرعت شروع شد! کلیه پروفایل‌ها تا ۳ الی ۵ دقیقه دیگر خروجی جدید می‌گیرند.";
                else status.innerText = "❌ خطا در اجرای تست فوری.";
            } catch (e) {
                status.innerText = "❌ خطا: " + e.message;
            }
        }
    </script>
</body>
</html>
